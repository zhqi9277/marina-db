$:
  tag_push:
    - stages:
        - name: build linux artifacts
          script: |
            set -e
            mkdir -p dist
            bash scripts/build-engine.sh redis 7.4.11 dist
            bash scripts/build-engine.sh postgres 17.11 dist
            bash scripts/build-engine.sh memcached 1.6.45 dist
            bash scripts/build-engine.sh mariadb 11.4.13 dist
        - name: create release
          type: git:release
          options:
            title: marina prebuilt engines
            description: Prebuilt engine artifacts and manifest
        - name: upload release artifacts
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - dist/*
