name: build-engines
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Build {0} from {1}', inputs.version, inputs.shard) || github.ref_name }}

on:
  push:
    tags: ['engines-candidate-*']
  workflow_dispatch:
    inputs:
      history_run:
        description: prepare-engine-history run ID
        required: true
        type: string
      shard:
        description: Prepared artifact name, for example history-mariadb-0
        required: true
        type: string
      version:
        description: Exact engine version in that artifact
        required: true
        type: string
      targets:
        description: Optional comma-separated OS and architecture pairs, for example linux-x64,win32-x64
        type: string

permissions:
  contents: read

concurrency:
  group: engines-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    outputs:
      combos: ${{ steps.matrix.outputs.combos }}
      tag: ${{ steps.matrix.outputs.tag }}
      historical: ${{ steps.history.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - id: history
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY_RUN: ${{ inputs.history_run }}
          SHARD: ${{ inputs.shard }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$GITHUB_REF_TYPE" == 'branch' ]]
          [[ "$HISTORY_RUN" =~ ^[0-9]+$ ]]
          [[ "$SHARD" =~ ^history-(mysql|mariadb|postgres|mongodb|redis|memcached)-[0-9]+$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HISTORY_RUN" \
            --jq 'select(.path == ".github/workflows/prepare-engine-history.yml") | .head_sha')
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$sha" "$GITHUB_SHA"
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: steps.history.outputs.enabled == 'true'
        with:
          name: ${{ inputs.shard }}
          path: prepared
          run-id: ${{ inputs.history_run }}
          github-token: ${{ github.token }}
      - name: Select prepared targets
        if: steps.history.outputs.enabled == 'true'
        env:
          SHARD: ${{ inputs.shard }}
          VERSION: ${{ inputs.version }}
          TARGETS: ${{ inputs.targets }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { parseBuildMatrix } from './scripts/engine-matrix.mjs';
          import { sourcesFor } from './scripts/engine-sources.mjs';
          const { SHARD, VERSION, TARGETS } = process.env;
          const engine = SHARD.split('-')[1];
          const file = `prepared/${engine}-${VERSION.replaceAll('.', '-')}.json`;
          const plan = parseBuildMatrix(JSON.parse(fs.readFileSync(file, 'utf8')));
          for (const row of plan) {
            if (row.engine !== engine || row.version !== VERSION || !row.inputs) {
              throw new Error('Unexpected entry in ' + file);
            }
            sourcesFor(row);
          }
          const targetId = ({ os, arch }) => `${os}-${arch}`;
          const targets = TARGETS.split(',').map((target) => target.trim()).filter(Boolean);
          if (targets.some((target) => !plan.some((row) => targetId(row) === target))) {
            throw new Error('A requested target has no locked inputs in ' + file);
          }
          const selected = plan.filter((row) => !targets.length || targets.includes(targetId(row)));
          fs.writeFileSync('engine-plan.json', JSON.stringify(selected) + '\n');
          JS
          echo 'MARINA_ENGINE_PLAN=engine-plan.json' >> "$GITHUB_ENV"
      - id: matrix
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            tag="engines-candidate-history-$GITHUB_RUN_ID"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "combos=$(node scripts/engine-matrix.mjs "$tag")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.history.outputs.enabled == 'true'
        with:
          name: locked-plan
          path: engine-plan.json
          overwrite: true
          if-no-files-found: error

  build:
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      MARINA_ENGINE_PLAN: ${{ needs.matrix.outputs.historical == 'true' && 'engine-plan.json' || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.combos) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        if: needs.matrix.outputs.historical == 'true'
        with:
          name: locked-plan
      - name: Build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake bison patchelf libaio1 libncurses5 libncurses-dev libnuma1 liburing2 libssl-dev
      - name: Oracle Linux RPM extractor
        if: matrix.engine == 'mysql' && runner.os == 'Linux' && matrix.arch == 'arm64'
        run: sudo apt-get install -y libarchive-tools
      - name: Build tools (macOS MariaDB)
        if: runner.os == 'macOS' && matrix.engine == 'mariadb'
        run: |
          brew list --versions bison >/dev/null || brew install bison
          ssl_root=$(brew --prefix openssl@3)
          test -f "$ssl_root/lib/libssl.a" || brew install openssl@3
          mkdir -p "$RUNNER_TEMP/marina-tools"
          ln -s "$(command -v cmake)" "$RUNNER_TEMP/marina-tools/cmake"
          ln -s "$(brew --prefix bison)/bin/bison" "$RUNNER_TEMP/marina-tools/bison"
          echo "MARINA_BUILD_PATH=$RUNNER_TEMP/marina-tools" >> "$GITHUB_ENV"
          echo "MARINA_OPENSSL_ROOT=$ssl_root" >> "$GITHUB_ENV"
      - name: Package for this platform
        run: node scripts/package-engine.mjs "${{ matrix.engine }}" "${{ matrix.version }}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: engine-${{ matrix.engine }}-${{ matrix.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  candidate:
    needs: [matrix, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      url: ${{ steps.release.outputs.url }}
      sha256: ${{ steps.release.outputs.sha256 }}
    env:
      MARINA_ENGINE_PLAN: ${{ needs.matrix.outputs.historical == 'true' && 'engine-plan.json' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        if: needs.matrix.outputs.historical == 'true'
        with:
          name: locked-plan
      - uses: actions/download-artifact@v8
        with:
          pattern: engine-*
          path: dist
          merge-multiple: true
      - name: Publish the checked candidate
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.matrix.outputs.tag }}
        run: |
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          node scripts/make-manifest.mjs generate dist "$base" "$TAG" > dist/manifest.json
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            if ! git ls-remote --exit-code origin "refs/tags/$TAG" > /dev/null; then
              git push origin "$GITHUB_SHA:refs/tags/$TAG"
            fi
            [[ $(git ls-remote origin "refs/tags/$TAG" | cut -f1) == "$GITHUB_SHA" ]]
          fi
          if ! gh release view "$TAG" --json isDraft > release-state.json; then
            gh release create "$TAG" --verify-tag --draft --prerelease --latest=false \
              --title "Marina engine candidate $TAG" --notes "Engine bundles for candidate $GITHUB_SHA"
            echo '{"isDraft":true}' > release-state.json
          fi
          if jq -e .isDraft release-state.json > /dev/null; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          digest=$(node scripts/make-manifest.mjs verify dist/manifest.json release.json "$base" "$TAG")
          echo "url=$base/manifest.json" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

  smoke:
    needs: [matrix, candidate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.combos) }}
    env:
      MARINA_CATALOG_URL: ${{ needs.candidate.outputs.url }}
      MARINA_CATALOG_SHA256: ${{ needs.candidate.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run smoke:e2e -- "${{ matrix.engine }}" "${{ matrix.version }}"

  validated:
    needs: [matrix, smoke, candidate]
    runs-on: ubuntu-22.04
    steps:
      - name: Record acceptance
        env:
          CATALOG_SHA256: ${{ needs.candidate.outputs.sha256 }}
          COMBINATIONS: ${{ needs.matrix.outputs.combos }}
          TAG: ${{ needs.matrix.outputs.tag }}
        run: |
          passed=$(jq '.include | length' <<< "$COMBINATIONS")
          jq -n --arg tag "$TAG" --arg sha "$GITHUB_SHA" --arg manifest "$CATALOG_SHA256" \
            --argjson passed "$passed" '{tag: $tag, sha: $sha, manifest: $manifest, passed: $passed}' > engine-validation.json
          echo "All $passed engine builds passed. Catalog SHA-256: $CATALOG_SHA256" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: engine-validation-${{ github.run_attempt }}
          path: engine-validation.json
          if-no-files-found: error
