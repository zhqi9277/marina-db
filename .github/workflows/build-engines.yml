name: build-engines
run-name: ${{ github.event_name == 'schedule' && format('Check upstream releases ({0} UTC)', github.event.schedule) || format('Build {0} {1}', inputs.engine, inputs.versions) }}

on:
  schedule:
    - cron: '17 1 * * *' # mysql
    - cron: '22 1 * * *' # mariadb
    - cron: '27 1 * * *' # postgres
    - cron: '32 1 * * *' # mongodb
    - cron: '37 1 * * *' # redis
    - cron: '42 1 * * *' # memcached
    - cron: '47 1 * * *' # qdrant
  workflow_dispatch:
    inputs:
      engine:
        description: Database engine
        type: choice
        required: true
        options: [mysql, mariadb, postgres, mongodb, redis, memcached, qdrant]
      versions:
        description: Comma-separated exact versions. Omit for the default builds or all versions in the selected history shard.
        type: string
      targets:
        description: Optional comma-separated platforms, for example linux-x64,win32-x64
        type: string
      history_run:
        description: Optional prepare-engine-history run ID
        type: string
      shard:
        description: History artifact from that run, for example history-mariadb-0
        type: string
      incremental:
        description: Check for missing upstream builds for this engine
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-engines-${{ github.event.schedule || github.run_id }}

jobs:
  matrix:
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    outputs:
      combos: ${{ steps.matrix.outputs.combos }}
      has_builds: ${{ steps.matrix.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify the history run
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ inputs.engine }}
          HISTORY_RUN: ${{ inputs.history_run }}
          SHARD: ${{ inputs.shard }}
          INCREMENTAL: ${{ inputs.incremental }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          [[ "$GITHUB_REF_TYPE" == 'branch' ]]
          if [[ "$INCREMENTAL" == 'true' && -n "$HISTORY_RUN$SHARD$VERSIONS" ]]; then
            echo 'Incremental checks select upstream versions automatically.' >&2
            exit 1
          fi
          if [[ -n "$HISTORY_RUN$SHARD" ]]; then
            [[ "$HISTORY_RUN" =~ ^[0-9]+$ ]]
            [[ "$SHARD" =~ ^history-$ENGINE-[0-9]+$ ]]
            sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HISTORY_RUN" \
              --jq 'select((.path | split("@")[0]) == ".github/workflows/prepare-engine-history.yml") | .head_sha')
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
            git merge-base --is-ancestor "$sha" "$GITHUB_SHA"
          fi
      - uses: actions/download-artifact@v8
        if: inputs.history_run != ''
        with:
          name: ${{ inputs.shard }}
          path: prepared
          run-id: ${{ inputs.history_run }}
          github-token: ${{ github.token }}
      - id: matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ inputs.engine }}
          VERSIONS: ${{ inputs.versions }}
          TARGETS: ${{ inputs.targets }}
          HISTORY_RUN: ${{ inputs.history_run }}
          INCREMENTAL: ${{ github.event_name == 'schedule' || inputs.incremental }}
          SCHEDULE: ${{ github.event.schedule }}
          MARINA_ENGINE_PLAN: engine-plan.json
        run: |
          if [[ "$INCREMENTAL" == 'true' ]]; then
            case "$SCHEDULE" in
              '17 1 * * *') ENGINE=mysql ;;
              '22 1 * * *') ENGINE=mariadb ;;
              '27 1 * * *') ENGINE=postgres ;;
              '32 1 * * *') ENGINE=mongodb ;;
              '37 1 * * *') ENGINE=redis ;;
              '42 1 * * *') ENGINE=memcached ;;
              '47 1 * * *') ENGINE=qdrant ;;
              '') ;;
              *) exit 1 ;;
            esac
            catalog_ref=refs/heads/engine-catalog
            catalog_head=$(git ls-remote origin "$catalog_ref")
            if [[ -n "$catalog_head" ]]; then
              git fetch origin "$catalog_ref"
              git show FETCH_HEAD:manifest.json > published.json
            else
              echo '{"schema":1,"artifacts":[]}' > published.json
            fi
            node scripts/prepare-engine-increment.mjs "$ENGINE" published.json "$MARINA_ENGINE_PLAN" "$TARGETS"
          else
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { selectEnginePlan } from './scripts/engine-matrix.mjs';
          import { sourcesFor } from './scripts/engine-sources.mjs';
          const { ENGINE, VERSIONS, TARGETS, HISTORY_RUN, MARINA_ENGINE_PLAN } = process.env;
          const plan = selectEnginePlan(ENGINE, {
            versions: VERSIONS, platforms: TARGETS, historyDir: HISTORY_RUN ? 'prepared' : undefined,
          });
          for (const row of plan) sourcesFor(row);
          fs.writeFileSync(MARINA_ENGINE_PLAN, JSON.stringify(plan) + '\n');
          JS
          fi
          if [[ $(jq length "$MARINA_ENGINE_PLAN") == 0 ]]; then
            echo 'has_builds=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'has_builds=true' >> "$GITHUB_OUTPUT"
          echo "combos=$(node scripts/engine-matrix.mjs)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.matrix.outputs.has_builds == 'true'
        with:
          name: locked-plan
          path: engine-plan.json
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  build:
    needs: matrix
    if: needs.matrix.outputs.has_builds == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    env:
      MARINA_ENGINE_PLAN: engine-plan.json
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.combos) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: locked-plan
      - name: Build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake bison patchelf libaio1 libncurses5 libncurses-dev libnuma1 liburing2 libssl-dev
      - name: Oracle Linux RPM extractor
        if: matrix.engine == 'mysql' && runner.os == 'Linux' && matrix.arch == 'arm64'
        run: sudo apt-get install -y libarchive-tools
      - name: MySQL 5.6 runtime (Windows)
        if: runner.os == 'Windows' && matrix.engine == 'mysql' && startsWith(matrix.version, '5.6.')
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "vcredist-2010-x64.exe"
          $url = "https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne "f3b7a76d84d23f91957aa18456a14b4e90609e4ce8194c5653384ed38dada6f3") {
            throw "Visual C++ 2010 x64 installer SHA-256 mismatch"
          }
          $install = Start-Process $installer -ArgumentList "/q", "/norestart" -Wait -PassThru
          if ($install.ExitCode -notin 0, 3010) {
            throw "Visual C++ 2010 x64 install exited with $($install.ExitCode)"
          }
      - name: Build tools (macOS MariaDB)
        if: runner.os == 'macOS' && matrix.engine == 'mariadb'
        run: |
          brew list --versions bison >/dev/null || brew install bison
          ssl_root=$(brew --prefix openssl@3)
          test -f "$ssl_root/lib/libssl.a" || brew install openssl@3
          mkdir -p "$RUNNER_TEMP/marina-tools"
          ln -s "$(command -v cmake)" "$RUNNER_TEMP/marina-tools/cmake"
          ln -s "$(brew --prefix bison)/bin/bison" "$RUNNER_TEMP/marina-tools/bison"
          echo "MARINA_BUILD_PATH=$RUNNER_TEMP/marina-tools" >> "$GITHUB_ENV"
          echo "MARINA_OPENSSL_ROOT=$ssl_root" >> "$GITHUB_ENV"
      - name: Package for this platform
        run: node scripts/package-engine.mjs "${{ matrix.engine }}" "${{ matrix.version }}" dist
      - name: Install and smoke test the archive
        run: npm run smoke:e2e -- "${{ matrix.engine }}" "${{ matrix.version }}" dist validated
      - uses: actions/upload-artifact@v7
        with:
          name: engine-${{ matrix.engine }}-${{ matrix.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          compression-level: 0
          retention-days: 7
          overwrite: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: validated-engine-${{ matrix.engine }}-${{ matrix.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: validated/*
          retention-days: 7
          overwrite: true
          if-no-files-found: error
