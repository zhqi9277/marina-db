name: build-engines
run-name: ${{ github.event_name == 'push' && 'Verify Milvus packages' || github.event_name == 'schedule' && format('Check upstream releases ({0} UTC)', github.event.schedule) || format('Build {0} {1}', inputs.engine, inputs.versions) }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-engines.yml
      - scripts/build-engine.sh
      - scripts/milvus-local.patch
      - scripts/package-engine.mjs
      - scripts/portable-libraries.mjs
      - scripts/reuse-milvus-build.sh
      - src/engines/milvus.js
      - test/e2e/smoke.mjs
  schedule:
    - cron: '17 1 * * *' # mysql
    - cron: '22 1 * * *' # mariadb
    - cron: '27 1 * * *' # postgres
    - cron: '32 1 * * *' # mongodb
    - cron: '37 1 * * *' # redis
    - cron: '42 1 * * *' # memcached
    - cron: '47 1 * * *' # qdrant
    - cron: '52 1 * * *' # milvus
  workflow_dispatch:
    inputs:
      engine:
        description: Database engine
        type: choice
        required: true
        options: [mysql, mariadb, postgres, mongodb, redis, memcached, qdrant, milvus]
      versions:
        description: Comma-separated exact versions. Omit for the default builds or all versions in the selected history shard.
        type: string
      targets:
        description: Optional comma-separated platforms, for example linux-x64,win32-x64
        type: string
      history_run:
        description: Optional prepare-engine-history run ID
        type: string
      shard:
        description: History artifact from that run, for example history-mariadb-0
        type: string
      incremental:
        description: Check for missing upstream builds for this engine
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-engines-${{ github.event.schedule || (github.event_name == 'push' && 'milvus-push') || github.run_id }}

jobs:
  matrix:
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    outputs:
      combos: ${{ steps.matrix.outputs.combos }}
      has_builds: ${{ steps.matrix.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify the history run
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ inputs.engine }}
          HISTORY_RUN: ${{ inputs.history_run }}
          SHARD: ${{ inputs.shard }}
          INCREMENTAL: ${{ inputs.incremental }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          [[ "$GITHUB_REF_TYPE" == 'branch' ]]
          if [[ "$INCREMENTAL" == 'true' && -n "$HISTORY_RUN$SHARD$VERSIONS" ]]; then
            echo 'Incremental checks select upstream versions automatically.' >&2
            exit 1
          fi
          if [[ -n "$HISTORY_RUN$SHARD" ]]; then
            [[ "$HISTORY_RUN" =~ ^[0-9]+$ ]]
            [[ "$SHARD" =~ ^history-$ENGINE-[0-9]+$ ]]
            sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HISTORY_RUN" \
              --jq 'select((.path | split("@")[0]) == ".github/workflows/prepare-engine-history.yml") | .head_sha')
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
            git merge-base --is-ancestor "$sha" "$GITHUB_SHA"
          fi
      - uses: actions/download-artifact@v8
        if: inputs.history_run != ''
        with:
          name: ${{ inputs.shard }}
          path: prepared
          run-id: ${{ inputs.history_run }}
          github-token: ${{ github.token }}
      - id: matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ inputs.engine }}
          VERSIONS: ${{ inputs.versions }}
          TARGETS: ${{ inputs.targets }}
          HISTORY_RUN: ${{ inputs.history_run }}
          INCREMENTAL: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.incremental }}
          SCHEDULE: ${{ github.event.schedule }}
          MARINA_ENGINE_PLAN: engine-plan.json
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            ENGINE=milvus
            TARGETS=linux-x64,darwin-arm64
          fi
          if [[ "$INCREMENTAL" == 'true' ]]; then
            case "$SCHEDULE" in
              '17 1 * * *') ENGINE=mysql ;;
              '22 1 * * *') ENGINE=mariadb ;;
              '27 1 * * *') ENGINE=postgres ;;
              '32 1 * * *') ENGINE=mongodb ;;
              '37 1 * * *') ENGINE=redis ;;
              '42 1 * * *') ENGINE=memcached ;;
              '47 1 * * *') ENGINE=qdrant ;;
              '52 1 * * *') ENGINE=milvus ;;
              '') ;;
              *) exit 1 ;;
            esac
            catalog_ref=refs/heads/engine-catalog
            catalog_head=$(git ls-remote origin "$catalog_ref")
            if [[ -n "$catalog_head" ]]; then
              git fetch origin "$catalog_ref"
              git show FETCH_HEAD:manifest.json > published.json
            else
              echo '{"schema":1,"artifacts":[]}' > published.json
            fi
            node scripts/prepare-engine-increment.mjs "$ENGINE" published.json "$MARINA_ENGINE_PLAN" "$TARGETS"
          else
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { selectEnginePlan } from './scripts/engine-matrix.mjs';
          import { sourcesFor } from './scripts/engine-sources.mjs';
          const { ENGINE, VERSIONS, TARGETS, HISTORY_RUN, MARINA_ENGINE_PLAN } = process.env;
          const plan = selectEnginePlan(ENGINE, {
            versions: VERSIONS, platforms: TARGETS, historyDir: HISTORY_RUN ? 'prepared' : undefined,
          });
          for (const row of plan) sourcesFor(row);
          fs.writeFileSync(MARINA_ENGINE_PLAN, JSON.stringify(plan) + '\n');
          JS
          fi
          if [[ $(jq length "$MARINA_ENGINE_PLAN") == 0 ]]; then
            echo 'has_builds=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'has_builds=true' >> "$GITHUB_OUTPUT"
          echo "combos=$(node scripts/engine-matrix.mjs)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.matrix.outputs.has_builds == 'true'
        with:
          name: locked-plan
          path: engine-plan.json
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  build:
    needs: matrix
    if: needs.matrix.outputs.has_builds == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.engine == 'milvus' && 350 || 100 }}
    permissions:
      actions: read
      contents: read
    env:
      MARINA_ENGINE_PLAN: engine-plan.json
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.combos) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ matrix.engine == 'milvus' && matrix.os == 'linux' && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: locked-plan
      - name: Find a reusable Milvus package
        if: matrix.engine == 'milvus' && runner.os == 'Linux' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/reuse-milvus-build.sh "${{ matrix.version }}" "${{ matrix.arch }}" "$RUNNER_TEMP/milvus-reuse"
      - name: Build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake bison patchelf libaio1 libncurses5 libncurses-dev libnuma1 liburing2 libssl-dev
      - name: Oracle Linux RPM extractor
        if: matrix.engine == 'mysql' && runner.os == 'Linux' && matrix.arch == 'arm64'
        run: sudo apt-get install -y libarchive-tools
      - name: MySQL 5.6 runtime (Windows)
        if: runner.os == 'Windows' && matrix.engine == 'mysql' && startsWith(matrix.version, '5.6.')
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "vcredist-2010-x64.exe"
          $url = "https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne "f3b7a76d84d23f91957aa18456a14b4e90609e4ce8194c5653384ed38dada6f3") {
            throw "Visual C++ 2010 x64 installer SHA-256 mismatch"
          }
          $install = Start-Process $installer -ArgumentList "/q", "/norestart" -Wait -PassThru
          if ($install.ExitCode -notin 0, 3010) {
            throw "Visual C++ 2010 x64 install exited with $($install.ExitCode)"
          }
      - name: Build tools (macOS MariaDB)
        if: runner.os == 'macOS' && matrix.engine == 'mariadb'
        run: |
          brew list --versions bison >/dev/null || brew install bison
          ssl_root=$(brew --prefix openssl@3)
          test -f "$ssl_root/lib/libssl.a" || brew install openssl@3
          mkdir -p "$RUNNER_TEMP/marina-tools"
          ln -s "$(command -v cmake)" "$RUNNER_TEMP/marina-tools/cmake"
          ln -s "$(brew --prefix bison)/bin/bison" "$RUNNER_TEMP/marina-tools/bison"
          echo "MARINA_BUILD_PATH=$RUNNER_TEMP/marina-tools" >> "$GITHUB_ENV"
          echo "MARINA_OPENSSL_ROOT=$ssl_root" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        if: matrix.engine == 'milvus' && !env.MARINA_MILVUS_REUSE_ARCHIVE
        with:
          go-version: '1.26.9'
          cache: false
      - uses: actions/setup-python@v6
        if: matrix.engine == 'milvus' && !env.MARINA_MILVUS_REUSE_ARCHIVE
        with:
          python-version: '3.11'
      - name: Build tools (Milvus)
        if: matrix.engine == 'milvus' && !env.MARINA_MILVUS_REUSE_ARCHIVE
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            # Source builds need room for the C++, Rust and Go objects.
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo apt-get install -y ninja-build libaio-dev uuid-dev \
              m4 autoconf automake libtool ccache pkg-config gfortran
          else
            brew install llvm@19 libomp ninja ccache pkg-config
            if [[ "$RUNNER_ARCH" == X64 ]]; then
              conan_home="$RUNNER_TEMP/milvus-conan"
              mkdir -p "$conan_home"
              cat > "$conan_home/global.conf" <<'CONF'
          core.net.http:max_retries=6
          core.download:retry=6
          core.download:retry_wait=15
          CONF
              echo "CONAN_HOME=$conan_home" >> "$GITHUB_ENV"
            fi
          fi
          python -m venv "$RUNNER_TEMP/milvus-tools"
          "$RUNNER_TEMP/milvus-tools/bin/pip" install 'cmake==3.31.10' 'conan==2.25.1'
          rustup toolchain install 1.92.0 --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.92.0" >> "$GITHUB_ENV"
          echo "MARINA_BUILD_PATH=$RUNNER_TEMP/milvus-tools/bin:$PATH" >> "$GITHUB_ENV"
      - name: Identify the Milvus source build
        id: milvus-native
        if: matrix.engine == 'milvus' && runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
        run: |
          recipe=$({
            shasum -a 256 scripts/build-engine.sh scripts/milvus-local.patch
            sw_vers -buildVersion
            xcodebuild -version
            brew list --versions llvm@19 libomp
            go version
            rustc --version
            "$RUNNER_TEMP/milvus-tools/bin/conan" --version
            "$RUNNER_TEMP/milvus-tools/bin/cmake" --version
            node --input-type=module <<'JS'
          import { readBuildMatrix } from './scripts/engine-matrix.mjs';
          import { sourcesFor } from './scripts/engine-sources.mjs';
          const row = readBuildMatrix().find(({ version, os, arch }) =>
            version === process.env.VERSION && os === process.platform && arch === process.arch);
          console.log(JSON.stringify(sourcesFor(row)));
          JS
          } | shasum -a 256 | cut -d' ' -f1)
          echo "key=milvus-native-v1-${{ matrix.os }}-${{ matrix.arch }}-$recipe" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        id: restore-milvus-native
        if: steps.milvus-native.outputs.key != ''
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/milvus-native
          key: ${{ steps.milvus-native.outputs.key }}
      - name: Package for this platform
        id: package
        env:
          MARINA_MILVUS_NATIVE_CACHE: ${{ steps.milvus-native.outputs.key && format('{0}/milvus-native', runner.temp) || '' }}
          MARINA_MILVUS_NATIVE_RESTORED: ${{ steps.restore-milvus-native.outputs.cache-hit }}
        run: node scripts/package-engine.mjs "${{ matrix.engine }}" "${{ matrix.version }}" dist
      - uses: actions/cache/save@v5
        if: "!cancelled() && steps.package.outputs.milvus_native_ready == 'true'"
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/milvus-native
          key: ${{ steps.milvus-native.outputs.key }}
      - name: Install and smoke test Milvus on a fresh macOS volume
        if: matrix.engine == 'milvus' && runner.os == 'macOS'
        shell: bash
        env:
          MARINA_SMOKE_LOG_DIR: smoke-logs
        run: |
          scratch=$(mktemp -d "$RUNNER_TEMP/milvus-smoke.XXXXXXXX")
          volume="$scratch/volume"
          attached=false
          cleanup() {
            if [[ "$attached" == true ]]; then
              hdiutil detach "$volume" -quiet || return 1
            fi
            rm -rf -- "$scratch"
          }
          trap cleanup EXIT
          mkdir "$volume"
          # Woodpecker measures the usage of the filesystem holding its WAL.
          hdiutil create -size 8g -fs APFS -type SPARSE -volname marina-milvus-smoke "$scratch/smoke" -quiet
          hdiutil attach "$scratch/smoke.sparseimage" -mountpoint "$volume" -nobrowse -noautoopen -quiet
          attached=true
          df -Pk "$volume"
          MARINA_SMOKE_TMPDIR="$volume" npm run smoke:e2e -- milvus "${{ matrix.version }}" dist validated
      - name: Install and smoke test the archive
        if: matrix.engine != 'milvus' || runner.os != 'macOS'
        env:
          MARINA_SMOKE_LOG_DIR: ${{ matrix.engine == 'milvus' && 'smoke-logs' || '' }}
        run: npm run smoke:e2e -- "${{ matrix.engine }}" "${{ matrix.version }}" dist validated
      - uses: actions/upload-artifact@v7
        if: success() || (failure() && matrix.engine == 'milvus' && steps.package.outcome == 'success')
        with:
          name: engine-${{ matrix.engine }}-${{ matrix.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          compression-level: 0
          retention-days: 7
          overwrite: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure() && matrix.engine == 'milvus' && steps.package.outcome == 'success'
        with:
          name: milvus-smoke-logs-${{ matrix.os }}-${{ matrix.arch }}
          path: smoke-logs/
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: validated-engine-${{ matrix.engine }}-${{ matrix.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: validated/*
          retention-days: 7
          overwrite: true
          if-no-files-found: error
