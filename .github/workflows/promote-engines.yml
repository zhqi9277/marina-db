name: promote-engines

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful build-engines run ID
        type: string
      migrate_engine:
        description: Engine to migrate from legacy Releases, in place of a build run ID
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: engine-catalog
  queue: max

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify the workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          MIGRATE_ENGINE: ${{ inputs.migrate_engine }}
        run: |
          if [[ -n "$MIGRATE_ENGINE" ]]; then
            [[ -z "$RUN_ID" ]]
            [[ "$MIGRATE_ENGINE" =~ ^(mysql|mariadb|postgres|mongodb|redis|memcached)$ ]]
          else
            [[ "$RUN_ID" =~ ^[0-9]+$ ]]
            sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
              --jq 'select((.path | split("@")[0]) == ".github/workflows/build-engines.yml" and .conclusion == "success" and
                (.event == "workflow_dispatch" or .event == "schedule")) | .head_sha')
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
            git merge-base --is-ancestor "$sha" "$GITHUB_SHA"
          fi
      - uses: actions/download-artifact@v8
        if: inputs.run_id != ''
        with:
          name: locked-plan
          path: evidence
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        if: inputs.run_id != ''
        with:
          pattern: validated-engine-*
          path: evidence/validated
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish assets and update the stable catalog
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          MIGRATE_ENGINE: ${{ inputs.migrate_engine }}
        run: |
          parent=()
          stable_ref=refs/heads/engine-catalog
          stable_head=$(git ls-remote origin "$stable_ref")
          if [[ -n "$stable_head" ]]; then
            git fetch origin "$stable_ref"
            parent=(-p FETCH_HEAD)
            git show FETCH_HEAD:manifest.json > previous.json
          else
            echo '{"schema":1,"artifacts":[]}' > previous.json
          fi

          node scripts/publish-engines.mjs previous.json evidence > manifest.json
          blob=$(git hash-object -w manifest.json)
          tree=$(printf '100644 blob %s\tmanifest.json\n' "$blob" | git mktree)
          if (("${#parent[@]}" > 0)) && [[ "$tree" == "$(git rev-parse 'FETCH_HEAD^{tree}')" ]]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(git commit-tree "$tree" "${parent[@]}" -m "Publish engine catalog (${MIGRATE_ENGINE:-build $RUN_ID})")
          git push origin "$commit:$stable_ref"
